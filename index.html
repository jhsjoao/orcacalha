<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a68">
  <meta name="description" content="Orçamentos de calhas e rufos, clientes, agenda e campanhas de manutenção.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OrçaCalha">
  <title>OrçaCalha</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="app.css?v=1.1.2">
  <script>
    window.__erros = [];
    window.addEventListener('error', function (e) { window.__erros.push((e.message || 'erro') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); });
  </script>
</head>
<body>
  <header class="top" id="top">
    <button class="top-back" id="btnVoltar" aria-label="Voltar" hidden>‹</button>
    <div class="top-title">
      <b id="tituloTela">Agenda</b>
      <small id="subTela"></small>
    </div>
    <a class="top-cfg" href="#/config" aria-label="Configurações">⚙</a>
  </header>

  <main id="app" class="body" aria-live="polite"></main>

  <nav class="nav" id="nav">
    <a href="#/agenda" data-nav="agenda"><span class="ico">📆</span>Agenda</a>
    <a href="#/orcamentos" data-nav="orcamentos"><span class="ico">🧮</span>Orçar</a>
    <a href="#/clientes" data-nav="clientes"><span class="ico">👥</span>Clientes</a>
    <a href="#/campanhas" data-nav="campanhas"><span class="ico">🔔</span>Campanhas</a>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="modal" class="modal"><div id="modalBody"></div></dialog>

  <script src="jspdf.umd.min.js?v=1.1.2"></script>
  <script src="calc.js?v=1.1.2"></script>
  <script src="store.js?v=1.1.2"></script>
  <script src="pdf.js?v=1.1.2"></script>
  <script src="app.js?v=1.1.2"></script>
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        var app = document.querySelector('#app');
        if (window.__orcaOK || (app && app.children.length)) return;
        var faltando = [];
        if (!window.jspdf) faltando.push('jspdf.umd.min.js');
        if (!window.Calc) faltando.push('calc.js');
        if (!window.Store) faltando.push('store.js');
        if (!window.PDF) faltando.push('pdf.js');
        if (!faltando.length) faltando.push('app.js');
        var erros = (window.__erros || []).slice(0, 3);
        document.body.innerHTML = '<div style="font-family:sans-serif;padding:24px;line-height:1.5">' +
          '<h2 style="color:#c0392b">O app não carregou por completo</h2>' +
          '<p>Arquivo(s) com problema:</p><ul><li>' + faltando.join('</li><li>') + '</li></ul>' +
          (erros.length ? '<p>Erro informado pelo navegador:</p><pre style="white-space:pre-wrap;background:#f4f4f4;padding:8px;border-radius:8px;font-size:12px">' + erros.join('\n').replace(/</g, '&lt;') + '</pre>' : '') +
          '<p>Confira se esses arquivos estão no GitHub, no mesmo lugar do <b>index.html</b>, e recarregue a página.</p></div>';
      }, 2500);
    });
  </script>
</body>
</html>
