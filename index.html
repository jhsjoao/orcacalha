<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a68">
  <meta name="description" content="Orçamentos de calhas e rufos, clientes, agenda e campanhas de manutenção.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OrçaCalha">
  <title>OrçaCalha</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top" id="top">
    <button class="top-back" id="btnVoltar" aria-label="Voltar" hidden>‹</button>
    <div class="top-title">
      <b id="tituloTela">Agenda</b>
      <small id="subTela"></small>
    </div>
    <a class="top-cfg" href="#/config" aria-label="Configurações">⚙</a>
  </header>

  <main id="app" class="body" aria-live="polite"></main>

  <nav class="nav" id="nav">
    <a href="#/agenda" data-nav="agenda"><span class="ico">📆</span>Agenda</a>
    <a href="#/orcamentos" data-nav="orcamentos"><span class="ico">🧮</span>Orçar</a>
    <a href="#/clientes" data-nav="clientes"><span class="ico">👥</span>Clientes</a>
    <a href="#/campanhas" data-nav="campanhas"><span class="ico">🔔</span>Campanhas</a>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="modal" class="modal"><div id="modalBody"></div></dialog>

  <script src="jspdf.umd.min.js"></script>
  <script src="calc.js"></script>
  <script src="store.js"></script>
  <script src="pdf.js"></script>
  <script src="app.js"></script>
  <script>
    window.addEventListener('load', function () {
      var faltando = [];
      if (!window.jspdf) faltando.push('jspdf.umd.min.js');
      if (!window.Calc) faltando.push('calc.js');
      if (!window.Store) faltando.push('store.js');
      if (!window.PDF) faltando.push('pdf.js');
      if (!document.querySelector('#app').children.length) faltando.push('app.js');
      if (getComputedStyle(document.body).display !== 'flex') faltando.push('app.css');
      if (faltando.length) {
        document.body.innerHTML = '<div style="font-family:sans-serif;padding:24px;line-height:1.5">' +
          '<h2 style="color:#c0392b">O app não carregou por completo</h2>' +
          '<p>Estes arquivos não foram encontrados no servidor:</p><ul><li>' + faltando.join('</li><li>') + '</li></ul>' +
          '<p>Envie esses arquivos para o mesmo lugar do <b>index.html</b> no GitHub e recarregue a página.</p></div>';
      }
    });
  </script>
</body>
</html>
